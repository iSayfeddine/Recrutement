<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Tawassol Sihi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); }
        .glow-blue { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        /* Scrollbar styling for modal */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 relative">

    <!-- LOGIN SECTION -->
    <div id="admin-login" class="max-w-md mx-auto mt-20 glass border border-slate-800 p-8 rounded-3xl shadow-2xl text-center">
        <h1 class="text-2xl font-extrabold text-sky-400 mb-2">لوحة الإدارة</h1>
        <p class="text-slate-400 text-sm mb-6" dir="ltr">Espace Administrateur</p>
        
        <input type="password" id="password-input" placeholder="Mot de passe" dir="ltr" class="w-full px-4 py-3 mb-4 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-sky-400 text-center text-white tracking-widest">
        
        <button id="login-btn" class="w-full py-3 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-xl transition glow-blue">
            Accéder / دخول
        </button>
        <p id="login-error" class="text-red-400 text-sm mt-4 hidden">Mot de passe incorrect</p>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="admin-dashboard" class="hidden max-w-7xl mx-auto space-y-8">
        <div class="text-center">
            <h1 class="text-3xl font-extrabold text-sky-400 mb-2">جدول المقابلات</h1>
            <p class="text-slate-400 text-sm mb-8" dir="ltr">Cliquez sur un candidat pour l'évaluer</p>
            <button id="refresh-btn" class="px-6 py-2 bg-slate-800 border border-sky-500/50 text-sky-400 rounded-lg hover:bg-slate-700 transition mb-6">
                Rafraîchir les données 🔄
            </button>
        </div>

        <!-- Tables Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" dir="ltr">
            
            <!-- Table 1 -->
            <div class="glass border border-slate-700 rounded-2xl p-6">
                <div class="text-center pb-4 mb-4 border-b border-slate-700">
                    <h2 class="text-2xl font-bold text-white">Table 1</h2>
                </div>
                <div id="table-1-list" class="space-y-3"></div>
            </div>

            <!-- Table 2 -->
            <div class="glass border border-slate-700 rounded-2xl p-6">
                <div class="text-center pb-4 mb-4 border-b border-slate-700">
                    <h2 class="text-2xl font-bold text-white">Table 2</h2>
                </div>
                <div id="table-2-list" class="space-y-3"></div>
            </div>

            <!-- Table 3 -->
            <div class="glass border border-slate-700 rounded-2xl p-6">
                <div class="text-center pb-4 mb-4 border-b border-slate-700">
                    <h2 class="text-2xl font-bold text-white">Table 3</h2>
                </div>
                <div id="table-3-list" class="space-y-3"></div>
            </div>

        </div>
    </div>

    <!-- EVALUATION MODAL -->
    <div id="evaluation-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" dir="ltr">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-3xl max-w-md w-full relative shadow-2xl">
            <button id="close-modal" class="absolute top-4 right-5 text-slate-400 hover:text-white text-xl">✕</button>
            
            <h3 class="text-2xl font-bold text-sky-400 mb-1" id="modal-name">Nom du candidat</h3>
            <p class="text-sm text-slate-400 mb-6 font-mono" id="modal-phone">06XXXXXXXX</p>

            <label class="block text-sm text-slate-300 mb-2 uppercase tracking-wider font-bold">Observation / Notes d'entretien :</label>
            <textarea id="modal-observation" rows="5" placeholder="Saisissez vos remarques ici..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-white focus:border-sky-500 outline-none mb-6 resize-none shadow-inner"></textarea>

            <div class="flex gap-4">
                <button id="btn-admis" class="flex-1 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition shadow-lg shadow-emerald-900/50">
                    ✅ ADMIS
                </button>
                <button id="btn-refuse" class="flex-1 py-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl transition shadow-lg shadow-red-900/50">
                    ❌ REFUSÉ
                </button>
            </div>
        </div>
    </div>

    <script>
        // === CONFIGURATION ===
        const ADMIN_PASSWORD = "admin2026"; 
        const SUPABASE_URL = 'https://bqsvdijbfdzzufkdwhhu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Ux4T1anrNknphRgb_yByNQ_lvrmuzCr';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentEditingPhone = null;

        // Elements
        const loginSection = document.getElementById('admin-login');
        const dashboardSection = document.getElementById('admin-dashboard');
        const passwordInput = document.getElementById('password-input');
        const loginBtn = document.getElementById('login-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        
        // Modal Elements
        const evalModal = document.getElementById('evaluation-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const btnAdmis = document.getElementById('btn-admis');
        const btnRefuse = document.getElementById('btn-refuse');
        const modalObservation = document.getElementById('modal-observation');

        // Login Logic
        loginBtn.addEventListener('click', () => {
            if (passwordInput.value === ADMIN_PASSWORD) {
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                loadDashboardData();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        });
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        // Refresh Button
        refreshBtn.addEventListener('click', async () => {
            const originalText = refreshBtn.innerHTML;
            refreshBtn.innerHTML = "Chargement en cours... ⏳";
            refreshBtn.disabled = true;
            await loadDashboardData();
            refreshBtn.innerHTML = "✅ Mis à jour !";
            setTimeout(() => {
                refreshBtn.innerHTML = originalText;
                refreshBtn.disabled = false;
            }, 1500);
        });

        // Fetch and display data
        async function loadDashboardData() {
            const { data, error } = await supabaseClient
                .from('candidates')
                .select('*')
                .not('slot_time', 'is', null)
                .order('slot_time', { ascending: true });

            if (error) return console.error(error);

            document.getElementById('table-1-list').innerHTML = '';
            document.getElementById('table-2-list').innerHTML = '';
            document.getElementById('table-3-list').innerHTML = '';

            let count1 = 0, count2 = 0, count3 = 0;

            data.forEach(candidate => {
                // Determine styling based on status
                let borderClass = "border-sky-500";
                let statusBadge = "";
                
                if (candidate.status === 'admis') {
                    borderClass = "border-emerald-500";
                    statusBadge = `<span class="px-2 py-1 bg-emerald-500/20 text-emerald-400 text-[10px] rounded uppercase font-bold ml-2">Admis</span>`;
                } else if (candidate.status === 'refuse') {
                    borderClass = "border-red-500";
                    statusBadge = `<span class="px-2 py-1 bg-red-500/20 text-red-400 text-[10px] rounded uppercase font-bold ml-2">Refusé</span>`;
                }

                const card = document.createElement('div');
                card.className = `bg-slate-800/80 p-3 rounded-lg flex justify-between items-center border-l-4 ${borderClass} hover:bg-slate-700 transition cursor-pointer`;
                card.onclick = () => openModal(candidate);
                
                card.innerHTML = `
                    <div class="flex flex-col">
                        <span class="font-bold text-slate-100 text-sm uppercase">${candidate.slot_time}</span>
                        <span class="text-xs text-slate-400">${candidate.phone}</span>
                    </div>
                    <div class="text-right flex-1 ml-4 flex items-center justify-end" dir="rtl">
                        ${statusBadge}
                        <span class="font-medium text-white text-sm">${candidate.full_name}</span>
                    </div>
                `;

                if (candidate.table_num === 1) { document.getElementById('table-1-list').appendChild(card); count1++; }
                else if (candidate.table_num === 2) { document.getElementById('table-2-list').appendChild(card); count2++; }
                else if (candidate.table_num === 3) { document.getElementById('table-3-list').appendChild(card); count3++; }
            });

            if (count1 === 0) document.getElementById('table-1-list').innerHTML = '<p class="text-center text-slate-500 text-sm mt-4">Aucun candidat pour le moment.</p>';
            if (count2 === 0) document.getElementById('table-2-list').innerHTML = '<p class="text-center text-slate-500 text-sm mt-4">Aucun candidat pour le moment.</p>';
            if (count3 === 0) document.getElementById('table-3-list').innerHTML = '<p class="text-center text-slate-500 text-sm mt-4">Aucun candidat pour le moment.</p>';
        }

        // Modal Logic
        function openModal(candidate) {
            currentEditingPhone = candidate.phone;
            document.getElementById('modal-name').textContent = candidate.full_name;
            document.getElementById('modal-phone').textContent = candidate.phone;
            modalObservation.value = candidate.observation || '';
            evalModal.classList.remove('hidden');
        }

        closeModalBtn.onclick = () => evalModal.classList.add('hidden');

        btnAdmis.onclick = () => saveEvaluation('admis');
        btnRefuse.onclick = () => saveEvaluation('refuse');

        async function saveEvaluation(status) {
            const observation = modalObservation.value;
            
            // Visual feedback on button
            const btn = status === 'admis' ? btnAdmis : btnRefuse;
            const originalText = btn.innerHTML;
            btn.innerHTML = "Sauvegarde... ⏳";
            
            const { error } = await supabaseClient
                .from('candidates')
                .update({ observation: observation, status: status })
                .eq('phone', currentEditingPhone);
            
            btn.innerHTML = originalText;

            if (error) {
                alert("Erreur lors de l'enregistrement !");
            } else {
                evalModal.classList.add('hidden');
                loadDashboardData(); // Refresh the list to show the new badge
            }
        }
    </script>
</body>
</html>
